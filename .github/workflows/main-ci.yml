name: Main CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Check environment files and backend syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check root environment file changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed_files=$(git diff --name-only --no-renames --diff-filter=AMT "$BASE_SHA" HEAD -- \
            .env '.env.*' ':!.env.example')
          if [[ -n "$changed_files" ]]; then
            echo "::error::This PR adds or changes a tracked root environment file."
            exit 1
          fi
      - name: Check legacy backend JavaScript syntax
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(git ls-files -z -- 'src/backend/*.js')
