name: Legacy CI

on:
  pull_request:
  push:
    branches:
      - legacy
      - legacy-tcc
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Legacy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile
      - name: Build frontend
        run: yarn build
